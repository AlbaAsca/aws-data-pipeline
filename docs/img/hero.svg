<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Paleta Tokyo Night (github.com/folke/tokyonight.nvim) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161E"/>
      <stop offset="1" stop-color="#16161E"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#7AA2F7"/><stop offset="1" stop-color="#BB9AF7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2335" stroke-width="1"/>
    </pattern>
    <style>
      .node { fill: #24283B; stroke-width: 2; }
      .label { fill: #C0CAF5; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #9AA5CE; font-size: 13px; text-anchor: middle; }
      .flow { fill: none; stroke-width: 2.5; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)" opacity="0.6"/>

  <!-- Título -->
  <text x="60" y="92" font-size="54" font-weight="800" fill="url(#title)">aws-data-pipeline</text>
  <text x="62" y="132" font-size="22" fill="#C0CAF5">Del cielo al panel: el tiempo de 6 ciudades españolas, cada día, en AWS.</text>
  <text x="62" y="162" font-size="16" fill="#9AA5CE">Lambda · S3 · EventBridge · CodeBuild · Terraform · dbt + DuckDB · GitHub OIDC · LocalStack</text>

  <!-- Flujo -->
  <g>
    <path class="flow" stroke="#7DCFFF" d="M200 290 H290"/>
    <path class="flow" stroke="#7DCFFF" d="M440 290 H530"/>
    <path class="flow" stroke="#E0AF68" d="M680 290 H770"/>
    <path class="flow" stroke="#BB9AF7" d="M920 290 H1010"/>
  </g>

  <!-- Paquetes de datos viajando -->
  <g>
    <circle r="6" fill="#7DCFFF"><animateMotion dur="4s" repeatCount="indefinite" path="M130 290 H1080"/></circle>
    <circle r="5" fill="#BB9AF7"><animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M130 290 H1080"/></circle>
    <circle r="5" fill="#E0AF68"><animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M130 290 H1080"/></circle>
  </g>

  <!-- Nodos -->
  <g>
    <rect class="node" x="60" y="245" width="140" height="90" rx="14" stroke="#7DCFFF"/>
    <text class="label" x="130" y="285">Open-Meteo</text>
    <text class="sub" x="130" y="308">API pública</text>

    <rect class="node" x="290" y="245" width="150" height="90" rx="14" stroke="#FF9E64"/>
    <text class="label" x="365" y="285">λ Lambda</text>
    <text class="sub" x="365" y="308">06:00 UTC · reintentos</text>

    <rect class="node" x="530" y="245" width="150" height="90" rx="14" stroke="#9ECE6A"/>
    <text class="label" x="605" y="285">S3 data lake</text>
    <text class="sub" x="605" y="308">Parquet · dt=AAAA-MM-DD</text>

    <rect class="node" x="770" y="245" width="150" height="90" rx="14" stroke="#F7768E"/>
    <text class="label" x="845" y="285">dbt + DuckDB</text>
    <text class="sub" x="845" y="308">16 tests de calidad</text>

    <rect class="node" x="1010" y="245" width="130" height="90" rx="14" stroke="#BB9AF7"/>
    <text class="label" x="1075" y="285">Panel</text>
    <text class="sub" x="1075" y="308">Streamlit</text>
  </g>

  <!-- Cifras -->
  <g class="pulse">
    <rect x="860" y="40" width="280" height="40" rx="20" fill="#16161E" stroke="#9ECE6A" stroke-width="1.5"/>
    <text x="1000" y="66" font-size="16" fill="#9ECE6A" text-anchor="middle">● &lt; 0,01 $ en AWS real · CI en verde</text>
  </g>
  <text x="1140" y="378" font-size="12" fill="#565F89" text-anchor="end">Fase 1 LocalStack · Fase 2 AWS real · Fase 3 OIDC + alarmas + dbt programado</text>
</svg>
