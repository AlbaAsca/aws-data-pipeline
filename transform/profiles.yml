# DuckDB hace el papel de Athena: SQL directamente sobre el Parquet del lago.
weather:
  target: local
  outputs:
    # Ficheros en disco (sin Docker ni red).
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
    # S3: LocalStack por defecto; en AWS real basta con cambiar S3_ENDPOINT y las credenciales.
    lake:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
      extensions: [httpfs]
      settings:
        s3_region: "{{ env_var('AWS_DEFAULT_REGION', 'eu-south-2') }}"
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:4566') }}"
        s3_use_ssl: "{{ env_var('S3_USE_SSL', 'false') }}"
        s3_url_style: "{{ env_var('S3_URL_STYLE', 'path') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'test') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'test') }}"
