name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests y dbt (sin red)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: dbt build sobre un día guardado (fixture)
        run: |
          python scripts/run_local.py --fixture tests/fixtures/open_meteo_2026-10-30.json --date 2026-10-30
          cd transform && dbt build --profiles-dir .
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  localstack-e2e:
    name: Punta a punta en LocalStack
    runs-on: ubuntu-latest
    needs: quality
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-south-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: pip install -r requirements-dev.txt
      - run: make up
      - run: make deploy
      - run: make ingest DAYS=3
      - run: make transform
      - name: Comprobar el resultado
        run: |
          python - <<'EOF'
          import duckdb
          con = duckdb.connect("data/warehouse.duckdb", read_only=True)
          n = con.execute("select count(*) from fct_weather_daily").fetchall()[0][0]
          print(con.sql("select * from city_climate_summary"))
          assert n == 18, f"esperaba 6 ciudades x 3 días, hay {n}"
          EOF
      - name: Logs de LocalStack si algo falla
        if: failure()
        run: docker logs localstack | tail -200
